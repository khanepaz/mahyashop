<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مهیا شاپ</title>
  <meta name="description" content="فروشگاه آنلاین مهیا شاپ" />
  <style>
    :root {
      --bg: #fafafa; --surface: #fff; --text: #0a0a0a; --muted: #737373;
      --border: #ebebeb; --accent: #0a0a0a; --danger: #ef4444; --success: #16a34a;
      --radius: 16px; --shadow: 0 8px 30px rgba(0,0,0,.06);
      --font: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
    button, input, select, textarea { font: inherit; }
    button { border: 0; cursor: pointer; background: none; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    .container { width: min(1120px, calc(100% - 28px)); margin: 0 auto; }
    .header { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.9); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
    .header-inner { display: flex; align-items: center; gap: 14px; min-height: 64px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
    .logo-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; }
    .search { flex: 1; max-width: 420px; margin: 0 auto; position: relative; }
    .search input { width: 100%; height: 42px; border-radius: 12px; border: 1px solid transparent; background: #f3f3f3; padding: 0 40px 0 14px; outline: none; }
    .search input:focus { background: #fff; border-color: #ddd; }
    .search-ico { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #999; }
    .icon-btn { width: 42px; height: 42px; border-radius: 12px; background: #f3f3f3; display: grid; place-items: center; position: relative; }
    .badge-count { position: absolute; top: -4px; left: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
    .hero { padding: 28px 0 8px; }
    .hero-card { border-radius: 22px; background: #0a0a0a; color: #fff; padding: 36px 28px; }
    .hero-card h1 { font-size: clamp(22px, 4vw, 34px); margin-bottom: 8px; }
    .hero-card p { color: #a3a3a3; font-size: 14px; max-width: 480px; }
    .cats { display: flex; gap: 8px; overflow-x: auto; padding: 18px 0 8px; scrollbar-width: none; }
    .cats::-webkit-scrollbar { display: none; }
    .cat-btn { flex: 0 0 auto; padding: 8px 14px; border-radius: 99px; background: #fff; border: 1px solid var(--border); color: var(--muted); font-size: 13px; }
    .cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0 16px; color: var(--muted); font-size: 13px; }
    .sort { height: 38px; border-radius: 10px; border: 1px solid var(--border); background: #fff; padding: 0 10px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; padding-bottom: 80px; }
    @media (max-width: 960px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 680px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } .search { display: none; } }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: .25s ease; }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
    .card-img { aspect-ratio: 1; background: #f4f4f4; position: relative; overflow: hidden; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .card-disc { position: absolute; top: 10px; right: 10px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 8px; }
    .card-body { padding: 12px 14px 14px; }
    .card-cat { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .card-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 10px; }
    .card-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .price-col { display: flex; flex-direction: column; }
    .old-price { font-size: 11px; color: #aaa; text-decoration: line-through; min-height: 16px; }
    .final-price { font-size: 15px; font-weight: 800; }
    .add-btn { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; }
    .add-btn:disabled { background: #e5e5e5; color: #aaa; }
    .state { grid-column: 1 / -1; min-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--muted); background: #fff; border: 1px dashed var(--border); border-radius: var(--radius); }
    .spinner { width: 32px; height: 32px; border-radius: 50%; border: 3px solid #e5e5e5; border-top-color: #111; animation: spin .7s linear infinite; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.4); opacity: 0; visibility: hidden; transition: .25s ease; }
    .overlay.open { opacity: 1; visibility: visible; }
    .modal { position: fixed; inset: 0; z-index: 110; display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; visibility: hidden; transition: .25s ease; pointer-events: none; }
    .modal.open { opacity: 1; visibility: visible; pointer-events: auto; }
    .modal-box { width: min(860px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: #fff; border-radius: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.18); }
    .modal-layout { display: grid; grid-template-columns: 1fr 1fr; }
    @media (max-width: 720px) { .modal-layout { grid-template-columns: 1fr; } }
    .modal-img { min-height: 280px; background: #f4f4f4; position: relative; }
    .modal-img img { width: 100%; height: 100%; object-fit: cover; max-height: 360px; }
    .modal-close { position: absolute; top: 12px; left: 12px; width: 36px; height: 36px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
    .modal-info { padding: 28px; }
    .modal-info h2 { font-size: 22px; margin: 6px 0 14px; }
    .modal-cat { font-size: 12px; color: var(--muted); }
    .modal-price-block { padding: 14px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .modal-old { font-size: 13px; color: #aaa; text-decoration: line-through; }
    .modal-final { font-size: 24px; font-weight: 800; }
    .disc-tag { display: inline-flex; padding: 2px 7px; border-radius: 6px; background: #fee2e2; color: #b91c1c; font-size: 11px; font-weight: 700; }
    .variant-group { margin-bottom: 14px; }
    .variant-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
    .variant-opts { display: flex; flex-wrap: wrap; gap: 8px; }
    .v-opt { min-width: 44px; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: #fff; }
    .v-opt.active { background: #0a0a0a; color: #fff; border-color: #0a0a0a; }
    .qty-row { display: flex; align-items: center; gap: 10px; margin: 12px 0 18px; }
    .qty-btn { width: 36px; height: 36px; border-radius: 10px; background: #f3f3f3; display: grid; place-items: center; font-size: 18px; }
    .qty-val { min-width: 28px; text-align: center; font-weight: 700; }
    .primary-btn { width: 100%; height: 48px; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 700; }
    .primary-btn:disabled { background: #e5e5e5; color: #aaa; }
    .drawer { position: fixed; top: 0; bottom: 0; left: 0; z-index: 120; width: min(380px, 100%); background: #fff; box-shadow: -8px 0 30px rgba(0,0,0,.1); transform: translateX(-100%); transition: .3s ease; display: flex; flex-direction: column; }
    .drawer.open { transform: none; }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 18px; border-bottom: 1px solid var(--border); }
    .drawer-items { flex: 1; overflow: auto; padding: 12px 16px; }
    .cart-empty { height: 100%; display: grid; place-items: center; color: var(--muted); }
    .c-item { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .c-item img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; background: #f4f4f4; }
    .c-title { font-size: 13px; font-weight: 700; }
    .c-var { font-size: 11px; color: var(--muted); }
    .c-price { font-size: 13px; font-weight: 700; margin-top: 4px; }
    .c-ctrl { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .c-qty { display: flex; align-items: center; gap: 6px; background: #f5f5f5; border-radius: 8px; padding: 2px; }
    .c-qty button { width: 28px; height: 28px; border-radius: 6px; }
    .c-remove { font-size: 12px; color: var(--danger); }
    .drawer-foot { padding: 16px; border-top: 1px solid var(--border); }
    .total-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-weight: 700; }
    .checkout-box, .success-box { width: min(440px, 100%); background: #fff; border-radius: 20px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.18); max-height: calc(100vh - 32px); overflow: auto; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #555; }
    .field input, .field textarea { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; outline: none; background: #fafafa; }
    .sum-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .sum-row.total { color: var(--text); font-weight: 800; font-size: 15px; margin-top: 8px; }
    .success-box { text-align: center; }
    .success-ico { width: 64px; height: 64px; border-radius: 50%; background: #dcfce7; color: var(--success); display: grid; place-items: center; font-size: 28px; margin: 0 auto 16px; }
    .bale-btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 48px; border-radius: 12px; background: #00b8a9; color: #fff; font-weight: 700; margin-bottom: 10px; }
    .ghost-btn { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--border); font-weight: 600; color: #555; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #0a0a0a; color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 13px; opacity: 0; pointer-events: none; transition: .25s ease; z-index: 200; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.ok { background: #166534; }
    .toast.err { background: #991b1b; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="./"><span class="logo-mark">م</span><span>مهیا شاپ</span></a>
      <div class="search">
        <input id="searchInput" type="search" placeholder="جستجوی محصول..." autocomplete="off" />
        <span class="search-ico">⌕</span>
      </div>
      <button class="icon-btn" id="cartBtn" aria-label="سبد خرید">🛒<span class="badge-count hidden" id="cartCount">0</span></button>
    </div>
  </header>
  <main class="container">
    <section class="hero"><div class="hero-card"><h1>خرید ساده و سریع</h1><p>محصولات منتخب با ارسال مطمئن. سفارش را ثبت کنید و ادامه را در بله پیگیری کنید.</p></div></section>
    <div class="cats" id="categoryList"></div>
    <div class="toolbar"><span id="resultInfo">—</span>
      <select class="sort" id="sortSelect">
        <option value="newest">جدیدترین</option>
        <option value="price-asc">ارزان‌ترین</option>
        <option value="price-desc">گران‌ترین</option>
        <option value="discount">بیشترین تخفیف</option>
      </select>
    </div>
    <div class="grid" id="productsGrid"><div class="state"><div class="spinner"></div><div>در حال بارگذاری...</div></div></div>
  </main>
  <div class="modal" id="productModal"><div class="overlay open" id="productOverlay" style="position:absolute"></div><div class="modal-box" id="productBox"></div></div>
  <div class="overlay" id="cartOverlay"></div>
  <aside class="drawer" id="cartDrawer">
    <div class="drawer-head"><h3>سبد خرید</h3><button class="icon-btn" id="cartClose" style="width:36px;height:36px">✕</button></div>
    <div class="drawer-items" id="cartItems"></div>
    <div class="drawer-foot"><div class="total-row"><span>جمع</span><span id="cartTotal">۰ تومان</span></div><button class="primary-btn" id="checkoutBtn">ادامه و ثبت سفارش</button></div>
  </aside>
  <div class="modal" id="checkoutModal"><div class="checkout-box"><h2>ثبت سفارش</h2>
    <form id="checkoutForm">
      <div class="field"><label for="customerName">نام و نام خانوادگی</label><input id="customerName" required placeholder="مثلاً علی رضایی" /></div>
      <div class="field"><label for="customerPhone">شماره موبایل</label><input id="customerPhone" required inputmode="tel" placeholder="09xxxxxxxxx" /></div>
      <div class="field"><label for="customerAddress">آدرس کامل</label><textarea id="customerAddress" required placeholder="شهر، خیابان، پلاک..."></textarea></div>
      <div class="field"><label for="customerNote">توضیحات (اختیاری)</label><textarea id="customerNote" placeholder="ساعت تماس..."></textarea></div>
      <div style="margin:14px 0 18px;padding-top:10px;border-top:1px solid var(--border)">
        <div class="sum-row"><span>تعداد اقلام</span><span id="checkoutItemsCount">۰</span></div>
        <div class="sum-row total"><span>مبلغ قابل پرداخت</span><span id="checkoutTotal">۰ تومان</span></div>
      </div>
      <button class="primary-btn" type="submit" id="submitOrderBtn">تأیید نهایی سفارش</button>
      <button class="ghost-btn" type="button" id="checkoutClose" style="margin-top:8px">انصراف</button>
    </form>
  </div></div>
  <div class="modal" id="successModal"><div class="success-box">
    <div class="success-ico">✓</div><h2>سفارش ثبت شد</h2>
    <p id="successMsg">سفارش شما ثبت شد.</p>
    <a class="bale-btn" id="baleOpenBtn" href="#" target="_blank" rel="noopener">باز کردن ربات بله</a>
    <button class="ghost-btn" id="successClose">بستن</button>
  </div></div>
  <div class="toast" id="toast"></div>
  <script src="./shop.js"></script>
</body>
</html>
